# CPU development run for the DreamFace encoder alone. Random weights, small crops.
# Retrieval numbers from this config describe the enrolled captures, not child recognition.
model:
  identity_dim: 64
  structure_dim: 16
  token_grid: 4
dataset:
  manifest: data/pairs/pairs.train.jsonl
  peer_manifests: [] # Supply every other split so the leakage audit covers the whole corpus.
  resolution: 64
  reference_count: 1
  allow_synthetic: false
  # Both views go through the production crop. Requires a headmask on every enrolled capture.
  source_crops: true
objective:
  name: supervised_contrastive
  temperature: 0.1
  # Negatives come from the other identities in the batch, so this is also the negative count.
  identities_per_batch: 8
optimizer:
  name: adamw
  lr: 0.0003
  betas: [0.9, 0.999]
  weight_decay: 0.01
scheduler:
  name: constant
  warmup_steps: 50
training:
  device: cpu
  precision: fp32
  seed: 1234
  max_steps: 2000
  gradient_clip: 1.0
  checkpoint_every: 200
  log_every: 20
  cpu_threads: 2
  tracker: jsonl
  output_dir: runs/identity-encoder
  verify_dataset_fingerprint: true
validation:
  manifest: data/pairs/pairs.validation.jsonl
  split: validation
  every: 200
  seed: 4321
  identities_per_batch: 8
  max_batches: 8
  # Held-out cross-view retrieval, higher is better. Selection on it proves separability
  # among enrolled identities, not calibrated identity preservation.
  metric: validation/retrieval_top1
