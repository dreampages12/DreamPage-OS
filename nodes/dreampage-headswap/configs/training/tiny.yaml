model:
  backbone: tiny
  identity_dim: 64
  structure_dim: 16
  width: 32
dataset:
  manifest: data/pairs.jsonl
  peer_manifests: [] # Supply all separate validation/test manifests for identity overlap audit.
  resolution: 64
  reference_count: 1
  allow_synthetic: false
  degradation: neutral
optimizer:
  name: adamw
  lr: 0.001
  betas: [0.9, 0.999]
  weight_decay: 0.01
scheduler:
  name: constant
  warmup_steps: 20
training:
  device: cpu
  precision: fp32
  seed: 1234
  batch_size: 2
  accumulation_steps: 2
  max_steps: 1000
  gradient_clip: 1.0
  checkpoint_every: 100
  log_every: 20
  cpu_threads: 2
  tracker: jsonl
  output_dir: runs/tiny
validation:
  # Held-out pairs, audited against the training manifest. `every: 0` validates only at the
  # final step. Selection is on a flow loss, which measures optimization, never identity.
  manifest: data/pairs.validation.jsonl
  split: validation
  every: 100
  seed: 4321
  batch_size: 1
  max_batches: 8
  sampling_steps: 8
  samples: false
  metric: validation/total
losses:
  flow_matching: 1.0
  reconstruction: 1.0
  outside_mask: 3.0
  boundary: 1.0
  lighting: 0.1
  local_texture: 0.1
  # These require independently validated licensed differentiable providers.
  # Enabling one without a provider raises an actionable error, never a fake proxy.
  global_identity: 0.0
  local_identity: 0.0
  facial_perceptual: 0.0
  pose: 0.0
  landmark: 0.0
  gaze: 0.0
  expression: 0.0
  age_consistency: 0.0
