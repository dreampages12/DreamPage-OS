[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dreampage-headswap"
version = "0.1.0"
description = "Identity-conditioned head reconstruction with authoritative template preservation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "Pillow>=10", "torch>=2.5", "PyYAML>=6", "scipy>=1.10"]

[project.optional-dependencies]
flux = ["diffusers==0.37.1", "transformers>=4.56.2,<5", "accelerate>=1.2", "safetensors>=0.4", "huggingface-hub>=0.34,<1"]
tracking = ["tensorboard>=2.18"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["dreampage_headswap*", "comfyui_dreampage_headswap*"]
exclude = ["tests*", "scripts*", "training*", "configs*", "docs*", "benchmarks*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
